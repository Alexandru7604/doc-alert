name: Wizz price monitor

on:
  schedule:
    - cron: '7 */2 * * *'   # la fiecare 2 ore (UTC)
  workflow_dispatch:          # buton manual "Run workflow"
    inputs:
      test:
        description: 'Trimite doar un push de test pe telefon'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wizz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # istoric pretului pastrat intre rulari (detectare minim nou)
      - uses: actions/cache@v4
        with:
          path: price_history.csv
          key: pricehist-${{ github.run_id }}
          restore-keys: pricehist-

      - name: Install deps
        run: |
          pip install --quiet playwright fast-flights
          python -m playwright install --with-deps chromium

      - name: Check price + alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MONITOR_TEST: ${{ inputs.test }}
        run: python wizz_price_monitor.py
